# Serves the built SPA and proxies /api/* to the backend container.
# No CDN, no external fonts, nothing fetched at runtime — everything
# this file references is either baked into the image or another
# service on the same Docker network.

server {
    # 8080, not 80: binding <1024 requires root, and this container runs as
    # the unprivileged "nginx" user (see Dockerfile). docker-compose.yml
    # maps host port 80 -> container port 8080, so the browser-facing
    # address is unaffected.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches backend MAX_UPLOAD_BYTES (app/routers/ingestion.py) exactly —
    # every format (CSV/JSON/.db/.sqlite) is capped at 20 MiB at both the
    # edge and the app, so nothing gets a silently different ceiling
    # depending on which layer rejects it first.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes like /dashboard or
    # /entities/Some%20Entity have no matching file on disk — always
    # serve index.html and let React Router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
