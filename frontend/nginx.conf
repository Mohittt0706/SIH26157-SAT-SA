# Serves the built SPA and proxies /api/* to the backend container.
# No CDN, no external fonts, nothing fetched at runtime — everything
# this file references is either baked into the image or another
# service on the same Docker network.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CSV uploads can be a few hundred KB; nginx's 1m default is too tight.
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: client-side routes like /dashboard or
    # /entities/Some%20Entity have no matching file on disk — always
    # serve index.html and let React Router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
