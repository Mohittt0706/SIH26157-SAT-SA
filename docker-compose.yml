services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - satsa_db:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin path through nginx's /api/ proxy (see frontend/nginx.conf),
        # not the backend's published host port — the browser only ever talks
        # to this container, which forwards to `backend` over the compose network.
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  satsa_db:
